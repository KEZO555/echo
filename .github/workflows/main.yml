name: Android App APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version from app.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            rust/spotify-core/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/spotify-core/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Set up Rust for Android
        run: |
          rustup target add aarch64-linux-android
          if ! command -v cargo-ndk >/dev/null; then cargo install cargo-ndk; fi

      - name: Build Rust playback engine
        env:
          ANDROID_ABIS: arm64-v8a
        run: |
          # The host-side build (UniFFI bindgen metadata) links librespot's
          # default Linux audio backend, which needs the ALSA headers.
          sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev pkg-config
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          chmod +x rust/build-rust.sh
          ./rust/build-rust.sh

      - name: Build Android app
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon)
          cp android/app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/echo_${{ env.VERSION }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ github.workspace }}/echo_${{ env.VERSION }}.apk

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/echo_${{ env.VERSION }}.apk
          tag_name: v${{ env.VERSION }}
          body: |
            ## What's Changed
            ${{ env.CHANGELOG }}
